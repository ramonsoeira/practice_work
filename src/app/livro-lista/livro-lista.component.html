<main class="container-fluid px-1">
  <h2 class="mt-2">Catálogo de Livros</h2>
  <table class="table table-striped">
    <thead class="table-dark">
      <tr><th>Título</th><th>Resumo</th><th>Editora</th><th>Autores</th></tr>
    </thead>
    <tbody>
      <tr *ngFor="let livro of livros">
        <td>{{ livro.titulo }}<br /><button class="btn btn-danger btn-sm mt-1" type="button" (click)="excluir(livro.codigo)">Excluir</button></td>
        <td>{{ livro.resumo }}</td>
        <td>{{ obterNome(livro.codEditora) }}</td>
        <td><ul class="mb-0"><li *ngFor="let autor of livro.autores">{{ autor }}</li></ul></td>
      </tr>
      <tr *ngIf="livros.length === 0"><td colspan="4">Nenhum livro cadastrado.</td></tr>
    </tbody>
  </table>
</main>
